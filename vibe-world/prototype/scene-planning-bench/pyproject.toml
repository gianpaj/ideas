[project]
name = "scene-planning-bench"
version = "0.1.0"
description = "Plain LLM scene-planning benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.201",
    "jsonschema>=4.26.0",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
]

[project.scripts]
scene-planning-bench = "scene_planning_bench:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
